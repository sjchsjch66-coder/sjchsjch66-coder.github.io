<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ぽこと黒の王国</title><style>
:root{--ink:#3b3552;--muted:#7d7594;--line:#ece2d6;--bg:#fbf6ee;--pink:#e8557a;--panel:#fff;--wip:#7a62c9;--badge-ink:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#f1ecfb;--muted:#b3aac8;--line:#3d3756;--bg:#211d2e;--pink:#ff8fae;--panel:#2c2740;--wip:#a994f0;--badge-ink:#211d2e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:1.75}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
header{margin:8px 0 20px}header a{color:var(--pink);text-decoration:none;font-weight:700}
a{color:var(--pink)}.muted{color:var(--muted);font-size:.9rem}
.hero{text-align:center;padding:12px 0 4px}.hero img{width:128px;height:128px;border-radius:28px;image-rendering:pixelated;box-shadow:0 6px 0 var(--line)}
.hero .sub{color:var(--pink);font-weight:800;letter-spacing:.2em;font-size:.9rem;margin:14px 0 0}.hero h1{font-size:2rem;margin:.1em 0 .3em}
.soon{display:inline-block;background:var(--wip);color:var(--badge-ink);font-weight:800;border-radius:99px;padding:6px 18px;font-size:.9rem}
.lead{margin:18px 0 0;text-align:center}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 0 10px;margin:0 -16px}
.shots img{width:390px;height:auto;flex:none;border-radius:18px;scroll-snap-align:center;image-rendering:pixelated;box-shadow:0 4px 0 var(--line)}
.feat{padding-left:0;list-style:none}.feat li{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:8px 0}
.feat b{color:var(--pink)}
</style></head>
<body><main><header><a href="../">← 七色パレットゲームズ</a></header>
<div class="hero"><img src="images/icon.png" alt="ぽこと黒の王国のドット絵"><p class="sub">ドット絵RPG</p><h1>ぽこと黒の王国</h1><span class="soon">制作中・12月下旬 配信予定</span></div>
<p class="lead">色をうばわれ、まっ黒にぬりつぶされた王国へ。<br>ぽこと なかまたちが、黒の核をこわして、町に色を取りもどす冒険です。</p>
<div class="shots"><img src="images/02_command.png" alt="バトルの画面" loading="lazy"><img src="images/04_special_noir.png" alt="必殺技のカットイン" loading="lazy"><img src="images/05_cutin_combo_pn.png" alt="コンビ技のカットイン" loading="lazy"></div>
<p class="muted" style="text-align:center">画面は制作中のものです。</p>
<ul class="feat">
<li><b>テンポのいいターン制バトル</b><br>オートと倍速つき。必殺技や、2人でくり出すコンビ技はカットインで派手に。</li>
<li><b>色がもどる瞬間を、ドット絵で</b><br>黒の核をこわすと、その場所に色がよみがえります。</li>
<li><b>いろどり村の世界の、新しいお話</b><br>『いろどり村のぽこ』『ぽこのいろどりマルシェ』とつながる物語。iPhone版を準備しています。</li>
</ul>
</main></body></html>
